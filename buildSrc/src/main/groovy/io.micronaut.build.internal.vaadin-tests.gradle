// Convention for the documentation test suites (test-suite, test-suite-groovy, test-suite-kotlin, test-suite-python)
plugins {
    id 'io.micronaut.build.internal.vaadin-base'
    // the test suites run the modules as an application does: their coverage counts toward the modules
    id 'jacoco'
}

dependencies {
    testRuntimeOnly(mnTest.junit.platform.launcher)
    testRuntimeOnly(mnTest.junit.jupiter.engine)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
