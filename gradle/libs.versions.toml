#
# This file is used to declare the list of libraries
# which are used as dependencies in the project.
# See https://docs.gradle.org/7.4.2/userguide/platforms.html#sub:central-declaration-of-dependencies
#
# For Micronaut, we have 3 kinds of dependencies:
#   - managed dependencies, which are exposed to consumers via a BOM (or version catalog)
#   - managed BOMs, which are imported into the BOM that we generate
#   - all other dependencies, which are implementation details
#
# If a library needs to appear in the BOM of the project, then it must be
# declared with the "managed-" prefix.
# If a BOM needs to be imported in the BOM of the project, then it must be
# declared with the "boms-" prefix.
# Both managed dependencies and BOMs need to have their version declared via
# a managed version (a version which alias starts with "managed-"

[versions]
micronaut = "5.3.0-SNAPSHOT"
micronaut-docs = "3.0.0"
micronaut-test = "5.2.0"
micronaut-logging = "2.1.0"
micronaut-security = "5.5.0"
micronaut-serde = "3.2.4"
micronaut-servlet = "6.2.2"
micronaut-session = "5.2.0"
groovy = "4.0.24"
spock = "2.3-groovy-4.0"
# The Vaadin platform release, for the free components (vaadin-core) used to compile against the browserless testers
vaadin = "25.3.1"
# The Jetty release of micronaut-servlet, to compile the session support against
jetty = "12.1.10"
# The Tomcat and Undertow releases of micronaut-servlet, for their WebSocket support in tests
tomcat = "11.0.25"
undertow = "2.3.26.Final"

# Managed versions appear in the BOM
# Vaadin 25.3.1 pairs Flow 25.3.2 with Flow Components 25.3.1. The platform's vaadin-bom is not
# imported because it also imports the Spring, Hilla and commercial TestBench BOMs.
managed-vaadin-flow = "25.3.2"
managed-vaadin-flow-components = "25.3.1"
managed-vaadin-browserless-test = "25.3.0"

[libraries]
# Core
micronaut-core = { module = 'io.micronaut:micronaut-core-bom', version.ref = 'micronaut' }
micronaut-logging = { module = "io.micronaut.logging:micronaut-logging-bom", version.ref = "micronaut-logging" }
micronaut-security = { module = "io.micronaut.security:micronaut-security-bom", version.ref = "micronaut-security" }
micronaut-serde = { module = "io.micronaut.serde:micronaut-serde-bom", version.ref = "micronaut-serde" }
micronaut-servlet = { module = "io.micronaut.servlet:micronaut-servlet-bom", version.ref = "micronaut-servlet" }
micronaut-session = { module = "io.micronaut.session:micronaut-session-bom", version.ref = "micronaut-session" }

#
# Imported BOMs, also appearing in the generated BOM
#
boms-vaadin-flow = { module = "com.vaadin:flow-bom", version.ref = "managed-vaadin-flow" }
boms-vaadin-flow-components = { module = "com.vaadin:flow-components-bom", version.ref = "managed-vaadin-flow-components" }
boms-vaadin-browserless-test = { module = "com.vaadin:browserless-test-bom", version.ref = "managed-vaadin-browserless-test" }

# Other libraries used by the project but non managed

# Versions from boms-vaadin-flow
vaadin-flow-server = { module = "com.vaadin:flow-server" }
vaadin-flow-push = { module = "com.vaadin:flow-push" }
vaadin-flow-html-components = { module = "com.vaadin:flow-html-components" }
vaadin-dev-server = { module = "com.vaadin:vaadin-dev-server" }
vaadin-ordered-layout = { module = "com.vaadin:vaadin-ordered-layout-flow" }
vaadin-button = { module = "com.vaadin:vaadin-button-flow" }
vaadin-text-field = { module = "com.vaadin:vaadin-text-field-flow" }

# Versions from boms-vaadin-browserless-test
vaadin-browserless-test-shared = { module = "com.vaadin:browserless-test-shared" }
vaadin-browserless-test-junit6 = { module = "com.vaadin:browserless-test-junit6" }

# The free Vaadin components, from the platform release
vaadin-core-components = { module = "com.vaadin:vaadin-core", version.ref = "vaadin" }
vaadin-dev-bundle = { module = "com.vaadin:vaadin-dev-bundle", version.ref = "vaadin" }

jetty-ee10-servlet = { module = "org.eclipse.jetty.ee10:jetty-ee10-servlet", version.ref = "jetty" }
jetty-ee10-websocket-jakarta-server = { module = "org.eclipse.jetty.ee10.websocket:jetty-ee10-websocket-jakarta-server", version.ref = "jetty" }
tomcat-embed-websocket = { module = "org.apache.tomcat.embed:tomcat-embed-websocket", version.ref = "tomcat" }
undertow-websockets-jsr = { module = "io.undertow:undertow-websockets-jsr", version.ref = "undertow" }

[bundles]

[plugins]
