vaadin.security.login-view=/login
micronaut.security.authentication=cookie
micronaut.security.token.jwt.signatures.secret.generator.secret=a test secret of at least thirty-two characters
micronaut.security.redirect.login-success=/admin
micronaut.security.redirect.login-failure=/login?error
micronaut.security.redirect.logout=/
micronaut.security.endpoints.logout.get-allowed=true
