pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'io.micronaut.build.shared.settings' version '8.1.4'
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'vaadin-parent'

include 'vaadin-bom'
include 'vaadin-browserless-test'
include 'vaadin-core'
// vaadin-dev builds against the development mode of Micronaut core (micronaut-core#13654), which is not released:
// it is included when a checkout of that branch is passed with --include-build
if (gradle.startParameter.includedBuilds.any { new File(it, 'dev-tck').directory }) {
    include 'vaadin-dev'
}
include 'vaadin-netty'
include 'vaadin-processor'
include 'vaadin-security'
include 'vaadin-servlet'

include 'test-suite'
include 'test-suite-dev-mode'
include 'test-suite-e2e'
include 'test-suite-e2e-netty'
include 'test-suite-e2e-addon'
include 'test-suite-e2e-addon-lib'
include 'test-suite-e2e-netty-hotdeploy'
include 'test-suite-e2e-security'
include 'test-suite-e2e-security-jetty'
include 'test-suite-e2e-security-session'
include 'test-suite-e2e-security-session-jetty'
include 'test-suite-production'
include 'test-suite-groovy'
include 'test-suite-native'
include 'test-suite-kotlin'
include 'test-suite-python'
include 'test-suite-security-jetty'
include 'test-suite-tomcat'
include 'test-suite-undertow'

enableFeaturePreview 'TYPESAFE_PROJECT_ACCESSORS'

micronautBuild {
    useStandardizedProjectNames = true
    // Micronaut 5.3 is unreleased: core snapshots come from the Central snapshots repository
    addSnapshotRepository()
    importMicronautCatalog()
    importMicronautCatalog("micronaut-security")
    importMicronautCatalog("micronaut-serde")
    importMicronautCatalog("micronaut-servlet")
    importMicronautCatalog("micronaut-session")
}
